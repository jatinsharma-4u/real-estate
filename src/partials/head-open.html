<script>
  (function(d){var c=d.documentElement.classList;c.add('js');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)c.add('reduced');

  window.__azFail=setTimeout(function(){c.add('anim-failsafe')},7000);})(document);
</script>
