<section class="cinfo section" aria-labelledby="cinfo-title">
  <div class="container">
    <header class="sec-head">
      <div>
        <p class="eyebrow" data-reveal>Reach us</p>
        <h2 class="h2" id="cinfo-title" data-split="lines">Prefer to <em>talk?</em></h2>
      </div>
      <p class="sec-head__aside" data-reveal>Our experience centre is open every day, 10am to 7pm. Walk in, or book a private tour.</p>
    </header>
    <ul class="cinfo__grid" data-stagger>
      <li class="ccard"><span class="ccard__ic"><svg class="i"><use href="#i-phone"/></svg></span><span class="ccard__k">Phone</span><a href="tel:{{site.phone_tel}}">{{site.phone}}</a></li>
      <li class="ccard"><span class="ccard__ic"><svg class="i"><use href="#i-mail"/></svg></span><span class="ccard__k">Email</span><a href="mailto:{{site.email}}">{{site.email}}</a></li>
      <li class="ccard"><span class="ccard__ic"><svg class="i"><use href="#i-wa"/></svg></span><span class="ccard__k">WhatsApp</span><a href="https://wa.me/{{site.whatsapp}}?text={{site.wa_text_enc}}" target="_blank" rel="noopener" data-wa-link>Chat with an advisor</a></li>
      <li class="ccard"><span class="ccard__ic"><svg class="i"><use href="#i-pin"/></svg></span><span class="ccard__k">Experience centre</span><address>{{site.address}}</address></li>
    </ul>
  </div>
</section>
