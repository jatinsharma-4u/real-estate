<section class="showcase" id="showcase" aria-labelledby="showcase-title" data-showcase>
  <div class="showcase__pin" data-showcase-pin>
    <header class="showcase__head container">
      <div>
        <p class="eyebrow" data-reveal>Inside &amp; Out</p>
        <h2 class="h2" id="showcase-title" data-split="lines">Every space, <em>composed.</em></h2>
      </div>
      <div class="showcase__prog" aria-hidden="true">
        <span class="showcase__count"><b data-showcase-cur>01</b><span>/ 06</span></span>
        <span class="showcase__bar"><i data-showcase-bar></i></span>
      </div>
    </header>

    <div class="showcase__viewport" data-showcase-viewport tabindex="0" role="region" aria-label="Property showcase. Scroll or swipe sideways to browse." data-cursor="Drag">
      <ul class="showcase__track" data-showcase-track>
        <li class="panel" data-panel>
          <figure class="panel__fig">
            <div class="panel__img">{{pic n="ext-pool" sizes="(min-width:1024px) 58vw, 86vw" alt="Cube-form villa with infinity pool and glass balustrades" cls="panel__pic" pos="50% 50%"}}</div>
            <figcaption class="panel__cap"><span class="panel__num">01</span><h3 class="panel__title">Exterior</h3><p>Crisp white volumes, deep overhangs and glass that dissolves into the sky.</p></figcaption>
          </figure>
        </li>
        <li class="panel" data-panel>
          <figure class="panel__fig">
            <div class="panel__img">{{pic n="int-living2" sizes="(min-width:1024px) 58vw, 86vw" alt="Double-height living room with floating staircase and warm timber floors" cls="panel__pic" pos="50% 50%"}}</div>
            <figcaption class="panel__cap"><span class="panel__num">02</span><h3 class="panel__title">Living spaces</h3><p>Double-height volumes and 11-foot glazing, filled with borrowed light.</p></figcaption>
          </figure>
        </li>
        <li class="panel" data-panel>
          <figure class="panel__fig">
            <div class="panel__img">{{pic n="bed1" sizes="(min-width:1024px) 58vw, 86vw" alt="Primary bedroom with a tufted headboard and skyline view" cls="panel__pic" pos="50% 62%"}}</div>
            <figcaption class="panel__cap"><span class="panel__num">03</span><h3 class="panel__title">Bedrooms</h3><p>Quiet suites with acoustic glazing, walk-in wardrobes and spa-grade baths.</p></figcaption>
          </figure>
        </li>
        <li class="panel" data-panel>
          <figure class="panel__fig">
            <div class="panel__img">{{pic n="kit1" sizes="(min-width:1024px) 58vw, 86vw" alt="Bright open kitchen with a marble island and pendant lights" cls="panel__pic" pos="50% 55%"}}</div>
            <figcaption class="panel__cap"><span class="panel__num">04</span><h3 class="panel__title">Kitchen</h3><p>Stone-topped islands and integrated appliances, made for long mornings.</p></figcaption>
          </figure>
        </li>
        <li class="panel" data-panel>
          <figure class="panel__fig">
            <div class="panel__img">{{pic n="pool-view" sizes="(min-width:1024px) 58vw, 86vw" alt="Living room opening onto a private deck and plunge pool" cls="panel__pic" pos="50% 50%"}}</div>
            <figcaption class="panel__cap"><span class="panel__num">05</span><h3 class="panel__title">Balcony &amp; deck</h3><p>Wide sliding doors turn the living room into a sheltered outdoor room.</p></figcaption>
          </figure>
        </li>
        <li class="panel" data-panel>
          <figure class="panel__fig">
            <div class="panel__img">{{pic n="club-eve" sizes="(min-width:1024px) 58vw, 86vw" alt="Clubhouse and reflecting pool glowing at dusk" cls="panel__pic" pos="50% 50%"}}</div>
            <figcaption class="panel__cap"><span class="panel__num">06</span><h3 class="panel__title">Amenities</h3><p>A clubhouse and reflecting pool that glow from dusk onwards.</p></figcaption>
          </figure>
        </li>
      </ul>
    </div>
  </div>
</section>
