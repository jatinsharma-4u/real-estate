<section class="cta" aria-labelledby="cta-title" data-cta-section>
  <div class="cta__bg" aria-hidden="true" data-parallax-wrap data-speed="1.25">
    {{pic n="ext-white-pool" sizes="100vw" cls="cta__pic" alt="" pos="50% 45%"}}
    <span class="cta__shade"></span>
  </div>
  <div class="container cta__inner">
    <p class="eyebrow" data-reveal>Visit</p>
    <h2 class="cta__title" id="cta-title" data-split="lines">Ready to find your <em>next address?</em></h2>
    <p class="cta__sub" data-reveal>Schedule a private property tour. We'll collect you, show you around, and leave the decision entirely to you.</p>
    <div class="cta__btns" data-reveal>
      <button class="btn btn--blue btn--lg" type="button" data-open-lead="Schedule a Visit" data-magnetic><span class="btn__label">Schedule a Visit</span><span class="btn__icon"><svg class="i"><use href="#i-arrow-ur"/></svg></span></button>
      <a class="btn btn--line btn--lg" href="tel:{{site.phone_tel}}" data-magnetic><span class="btn__label">Talk to an Expert</span><span class="btn__icon"><svg class="i"><use href="#i-phone"/></svg></span></a>
    </div>
  </div>
</section>
